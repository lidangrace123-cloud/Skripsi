<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PayRoll WhatsApp Manager</title>
  <meta name="description" content="Login admin untuk mengelola slip gaji karyawan">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #38bdf8;
      --primary-soft: #e0f2fe;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Modern Light Blue Ambient Glow */
    body::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: 
        radial-gradient(circle at 30% 25%, rgba(186, 230, 253, 0.45) 0%, transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(224, 242, 254, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(240, 249, 255, 0.8) 0%, transparent 60%);
      animation: ambientFloat 14s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes ambientFloat {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(2%, 2%); }
      100% { transform: scale(0.98) translate(-1%, -1%); }
    }

    /* Subtle Light Grid Pattern */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(14, 165, 233, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 1;
      pointer-events: none;
    }

    .icon {
      width: 1.15em;
      height: 1.15em;
      display: inline-block;
      vertical-align: -0.2em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 430px;
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      margin: 0 auto 16px;
      box-shadow: 0 10px 25px -4px rgba(2, 132, 199, 0.35);
      animation: logoFloat 4s ease-in-out infinite alternate;
    }

    @keyframes logoFloat {
      from { transform: translateY(0); box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.3); }
      to { transform: translateY(-4px); box-shadow: 0 14px 28px -4px rgba(2, 132, 199, 0.45); }
    }

    .login-brand h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .login-brand p {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 34px 32px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(2, 132, 199, 0.05);
      backdrop-filter: blur(10px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .login-card:hover {
      box-shadow: 0 24px 50px -10px rgba(15, 23, 42, 0.1), 0 0 0 1px rgba(2, 132, 199, 0.1);
    }

    .login-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-control:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .form-control:focus + .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--primary);
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .toggle-password:hover {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #dc2626;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    .alert-error .icon {
      color: #dc2626;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
    }

    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #0369a1, #075985);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <div class="login-logo">
        <svg class="icon" style="width:28px;height:28px" viewBox="0 0 24 24">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
      </div>
      <h1>PayRoll Manager</h1>
      <p>Sistem Manajemen Slip Gaji & WhatsApp</p>
    </div>

    <div class="login-card">
      <div class="login-title">Selamat Datang</div>
      <div class="login-subtitle">Masuk ke panel admin untuk melanjutkan</div>

      <div class="alert-error" id="error-msg">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span id="error-text"></span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              placeholder="Masukkan username"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Masukkan password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password" id="toggle-pass" aria-label="Toggle password visibility">
              <svg class="icon" id="eye-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span id="btn-label">Masuk ke Dashboard</span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      PayRoll WhatsApp Manager &copy; 2026
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const loginBtn = document.getElementById('login-btn');
    const btnLabel = document.getElementById('btn-label');
    const togglePass = document.getElementById('toggle-pass');
    const passInput = document.getElementById('password');

    const eyeOpenSvg = '<svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const eyeClosedSvg = '<svg class="icon" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    togglePass.addEventListener('click', () => {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
      togglePass.innerHTML = isPassword ? eyeClosedSvg : eyeOpenSvg;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = passInput.value;

      if (!username || !password) {
        showError('Username dan password wajib diisi.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin'
        });

        const data = await res.json();

        if (data.success) {
          btnLabel.textContent = 'Berhasil! Mengalihkan...';
          setTimeout(() => window.location.href = data.redirect || '/dashboard', 400);
        } else {
          showError(data.message || 'Login gagal.');
          setLoading(false);
        }
      } catch (err) {
        showError('Tidak dapat terhubung ke server. Pastikan server berjalan.');
        setLoading(false);
      }
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.style.display = 'flex';
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      if (loading) {
        btnLabel.innerHTML = '<span class="spinner"></span> Memverifikasi...';
      } else {
        btnLabel.textContent = 'Masuk ke Dashboard';
      }
    }
  </script>
</body>
</html>
