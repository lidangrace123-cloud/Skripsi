<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PayRoll WhatsApp Manager</title>
  <meta name="description" content="Login admin untuk mengelola slip gaji karyawan">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 25% 25%, rgba(99,102,241,0.12) 0%, transparent 50%),
                  radial-gradient(circle at 75% 75%, rgba(14,165,233,0.08) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1.1) rotate(5deg); }
    }

    /* Grid pattern */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(148,163,184,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(148,163,184,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
      box-shadow: 0 0 30px rgba(99,102,241,0.4);
      animation: logoPulse 2s ease-in-out infinite alternate;
    }

    @keyframes logoPulse {
      from { box-shadow: 0 0 20px rgba(99,102,241,0.3); }
      to { box-shadow: 0 0 40px rgba(99,102,241,0.6); }
    }

    .login-brand h1 {
      font-size: 22px;
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: -0.5px;
    }

    .login-brand p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .login-card {
      background: rgba(30,41,59,0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(148,163,184,0.12);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%; transform: translateY(-50%);
      font-size: 16px;
      color: #64748b;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: #0f172a;
      border: 1px solid rgba(148,163,184,0.12);
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: rgba(99,102,241,0.6);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .form-control::placeholder { color: #475569; }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%; transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-password:hover { color: #94a3b8; }

    .alert-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #f87171;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }

    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #818cf8, #6366f1);
      box-shadow: 0 6px 24px rgba(99,102,241,0.5);
      transform: translateY(-1px);
    }

    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <div class="login-logo">💼</div>
      <h1>PayRoll Manager</h1>
      <p>Sistem Manajemen Slip Gaji & WhatsApp</p>
    </div>

    <div class="login-card">
      <div class="login-title">Selamat Datang 👋</div>
      <div class="login-subtitle">Masuk ke panel admin untuk melanjutkan</div>

      <div class="alert-error" id="error-msg">
        <span>⚠️</span>
        <span id="error-text"></span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              placeholder="Masukkan username"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Masukkan password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password" id="toggle-pass" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span id="btn-label">Masuk ke Dashboard</span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      PayRoll WhatsApp Manager &copy; 2026
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const loginBtn = document.getElementById('login-btn');
    const btnLabel = document.getElementById('btn-label');
    const togglePass = document.getElementById('toggle-pass');
    const passInput = document.getElementById('password');

    togglePass.addEventListener('click', () => {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
      togglePass.textContent = isPassword ? '🙈' : '👁️';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = passInput.value;

      if (!username || !password) {
        showError('Username dan password wajib diisi.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin'
        });

        const data = await res.json();

        if (data.success) {
          btnLabel.textContent = 'Berhasil! Mengalihkan...';
          setTimeout(() => window.location.href = data.redirect || '/dashboard', 500);
        } else {
          showError(data.message || 'Login gagal.');
          setLoading(false);
        }
      } catch (err) {
        showError('Tidak dapat terhubung ke server. Pastikan server berjalan.');
        setLoading(false);
      }
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.style.display = 'flex';
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      if (loading) {
        btnLabel.innerHTML = '<span class="spinner"></span> Memverifikasi...';
      } else {
        btnLabel.textContent = 'Masuk ke Dashboard';
      }
    }
  </script>
</body>
</html>
