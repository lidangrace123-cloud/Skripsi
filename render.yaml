services:
  - type: web
    name: wasender-skripsi
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FONNTE_TOKEN
        value: FgFdxBWRkzb5GuLgRPtv
      - key: APP_BASE_URL
        value: https://wasender-skripsi.onrender.com
      - key: PDF_TOKEN_EXPIRY
        value: 604800
      - key: SEND_DELAY_MS
        value: 2000
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
